<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rules-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gavel-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow-rules" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Base circle badge -->
  <circle cx="50" cy="50" r="44" fill="url(#rules-bg)" stroke="#60a5fa" stroke-width="3" filter="url(#glow-rules)"/>
  
  <!-- Rulebook background -->
  <rect x="25" y="28" width="50" height="46" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="25" y="28" width="7" height="46" rx="2" fill="#1e40af"/>
  
  <!-- Text lines on book -->
  <line x1="38" y1="36" x2="68" y2="36" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="65" y2="44" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="52" x2="60" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Glowing green checkmark -->
  <path d="M42 62 L48 68 L64 54" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Legal Gavel -->
  <g transform="translate(62, 34) rotate(42)">
    <!-- Gavel Head -->
    <rect x="-7" y="-12" width="14" height="24" rx="3" fill="url(#gavel-wood)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="-9" y="-8" width="18" height="4" fill="#fef08a"/>
    <rect x="-9" y="4" width="18" height="4" fill="#fef08a"/>
    <!-- Handle -->
    <rect x="-3" y="10" width="6" height="32" rx="2" fill="url(#gavel-wood)"/>
  </g>
  
  <!-- Star accents -->
  <polygon points="20,24 22,28 26,30 22,32 20,36 18,32 14,30 18,28" fill="#fef08a"/>
</svg>
