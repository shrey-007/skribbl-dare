<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="picasso-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="cubist-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow-picasso" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Base circle badge -->
  <circle cx="50" cy="50" r="44" fill="url(#picasso-bg)" stroke="#c084fc" stroke-width="3" filter="url(#glow-picasso)"/>
  
  <!-- Cubist abstract geometric face fragments -->
  <polygon points="32,25 65,22 55,50 30,46" fill="#f43f5e" fill-opacity="0.8"/>
  <polygon points="55,22 76,36 68,66 48,52" fill="#06b6d4" fill-opacity="0.85"/>
  <polygon points="26,45 52,52 42,78 22,68" fill="#fbbf24" fill-opacity="0.9"/>
  <polygon points="46,52 74,62 62,80 38,76" fill="#ec4899" fill-opacity="0.85"/>
  
  <!-- Picasso abstract Eye (surreal cubist eye) -->
  <ellipse cx="44" cy="38" rx="10" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="45" cy="38" r="4" fill="#6366f1"/>
  <circle cx="46" cy="36" r="1.5" fill="#ffffff"/>
  
  <!-- Funky stylish blindfold / retro shades offset -->
  <path d="M22 34 L78 28 L76 44 L20 50 Z" fill="#18181b" stroke="#facc15" stroke-width="2" fill-opacity="0.9"/>
  <line x1="28" y1="39" x2="48" y2="37" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="35" x2="72" y2="33" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Surreal zigzag brush through mouth -->
  <path d="M30 68 Q50 60 70 72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tiny floating Picasso stars -->
  <circle cx="78" cy="24" r="2.5" fill="#facc15"/>
  <circle cx="22" cy="74" r="2" fill="#facc15"/>
</svg>
