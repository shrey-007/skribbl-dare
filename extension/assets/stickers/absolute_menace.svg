<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="menace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="horn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow-menace" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Base circle badge with spiky menacing rim -->
  <circle cx="50" cy="50" r="44" fill="url(#menace-bg)" stroke="#f87171" stroke-width="3" filter="url(#glow-menace)"/>
  
  <!-- Devil Horns -->
  <!-- Left Horn -->
  <path d="M30 38 C22 28 20 14 18 10 C26 14 36 26 36 34 Z" fill="url(#horn-grad)" stroke="#fef08a" stroke-width="1.5"/>
  <!-- Right Horn -->
  <path d="M70 38 C78 28 80 14 82 10 C74 14 64 26 64 34 Z" fill="url(#horn-grad)" stroke="#fef08a" stroke-width="1.5"/>
  
  <!-- Menacing Ink Creature Head -->
  <circle cx="50" cy="54" r="26" fill="#18181b"/>
  
  <!-- Mischievous angled eyes -->
  <!-- Left Eye -->
  <path d="M36 46 L46 51 L38 54 Z" fill="#facc15"/>
  <circle cx="41" cy="50" r="2" fill="#ef4444"/>
  <!-- Right Eye -->
  <path d="M64 46 L54 51 L62 54 Z" fill="#facc15"/>
  <circle cx="59" cy="50" r="2" fill="#ef4444"/>
  
  <!-- Wicked Grin with sharp fangs -->
  <path d="M36 62 Q50 74 64 62 Q50 68 36 62 Z" fill="#ffffff"/>
  <!-- Left fang -->
  <polygon points="43,64 46,64 44.5,69" fill="#18181b"/>
  <!-- Right fang -->
  <polygon points="54,64 57,64 55.5,69" fill="#18181b"/>
  
  <!-- Ink splatters / flames -->
  <circle cx="20" cy="56" r="3" fill="#18181b"/>
  <circle cx="80" cy="56" r="3.5" fill="#18181b"/>
  <circle cx="50" cy="84" r="4" fill="#18181b"/>
  
  <!-- Chaotic lightning spark -->
  <path d="M50 20 L46 28 L52 28 L48 36" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
